# Tunables for harden.sh and audit.sh.
#
# Every setting is an ordinary shell variable, overridable from the environment
# for a one-off run:
#
#   CIS_SSH_MAX_AUTH_TRIES=2 ./harden.sh --apply
#
# Values here are the series defaults, chosen to satisfy the CIS Debian Linux
# Benchmark v1.1.1 without being so aggressive that they break a working host.

# --- SSH (CIS 5.2.x) -------------------------------------------------------
# Key-only access is the series target. harden.sh refuses to apply 'no' unless
# it can see a non-empty authorized_keys somewhere, to prevent lockout.
CIS_SSH_PASSWORD_AUTH="no"
CIS_SSH_ROOT_LOGIN="no"
CIS_SSH_MAX_AUTH_TRIES="3"
CIS_SSH_CLIENT_ALIVE_INTERVAL="300"
CIS_SSH_X11_FORWARDING="no"

# --- Filesystems (CIS 1.1.1.x) ---------------------------------------------
# Set to 0 to report the unused-filesystem finding without remediating it.
# Unloading a module while a process holds an open file on it triggers the OOM
# killer, which is why audit.sh always reports this even when it is disabled.
CIS_DISABLE_UNUSED_FS="1"

# --- Core dumps (CIS 1.1.8) ------------------------------------------------
CIS_CORE_DUMPS="0"

# --- File permissions (CIS 1.1.1.1, 1.1.2) --------------------------------
# Format is ID:absolute-path:mode. Leave the ID empty to skip an entry.
CIS_PERM_PASSWD="perm_passwd:${ETC_DIR}/passwd:644"
CIS_PERM_SHADOW="perm_shadow:${ETC_DIR}/shadow:000"
CIS_PERM_GROUP="perm_group:${ETC_DIR}/group:644"
CIS_PERM_GSHADOW="perm_gshadow:${ETC_DIR}/gshadow:000"

# --- Accounts (CIS 5.4.x) --------------------------------------------------
CIS_PASSWORD_MAX_DAYS="90"

# --- Session (CIS 5.2.2) ---------------------------------------------------
CIS_DEFAULT_UMASK="027"

# --- Auditd (CIS 4.1.x) ----------------------------------------------------
CIS_AUDIT_IMMUTABLE="2"
